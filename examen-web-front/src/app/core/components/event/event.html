<div>count: {{ events().length }}</div>
@for (event of events(); track event.uuid) {
<div class="event">
  <h3>{{event.name}}</h3>
  <span>Du {{event.startDate}} au {{event.endDate}}</span>
  <div class="location">{{event.location}}</div>
  @if ( isAdmin() ){
  <div class="adminInsert">
    <button class="deleteButton" (click)="delete(event.uuid)">delete</button>
  </div>
  }
</div>
}
